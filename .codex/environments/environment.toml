# Repository-managed Rust workspace environment.
version = 1
name = "apart-epistemics-sprint"

[setup]
script = "bash scripts/setup.sh"

[cleanup]
script = "cargo clean"

[[actions]]
name = "VERIFY FAST"
icon = "run"
command = "bash scripts/verify-fast.sh"

[[actions]]
name = "VERIFY FULL"
icon = "run"
command = "bash scripts/verify.sh"
